<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Doc_GPT – NHS/CDC RAG Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b0f13;
      --panel: #121820;
      --text: #e8eef5;
      --muted: #9bb0c3;
      --accent: #57a6ff;
      --warn: #ffb020;
      --danger: #ff5b6e;
      --ok: #2ecc71;
      --card: #0f151c;
      --chip: #1d2631;
      --border: #242f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0e141b, #0b0f13);
      position: sticky; top: 0; z-index: 10;
    }
    header .brand { display: flex; gap: 10px; align-items: center; }
    .brand .logo { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
    main {
      max-width: 980px; margin: 28px auto; padding: 0 16px; display: grid; gap: 16px;
      grid-template-columns: 1fr;
    }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 10px; }
    .grow { flex: 1; }
    textarea, input {
      width: 100%; background: var(--card); color: var(--text);
      border: 1px solid var(--border); outline: none; border-radius: 10px;
      padding: 12px 14px; font-size: 14px;
    }
    button {
      background: var(--accent); color: #08111a; border: none; border-radius: 10px;
      padding: 12px 16px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .pill { display: inline-flex; gap: 8px; border-radius: 999px; padding: 8px 12px; font-size: 12px; }
    .pill.warn { background: #2b1e07; color: var(--warn); border: 1px solid #3b2b0b; }
    .pill.danger { background: #2b0e13; color: var(--danger); border: 1px solid #3a161b; }
    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: var(--chip); color: var(--muted); font-size: 12px; padding: 6px 8px; border-radius: 999px; border: 1px solid var(--border); }
    a { color: var(--accent); text-decoration: none; }
    .small { font-size: 12px; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"></div>
      <h1>Doc_GPT • Health Q&A (NHS/CDC)</h1>
    </div>
    <div class="muted small">Local demo • not medical advice</div>
  </header>

  <main>
    <section class="panel">
      <div class="grid" style="gap: 12px;">
        <div class="row">
          <textarea id="q" rows="3" placeholder="Describe your symptoms… e.g., sore throat and mild fever."></textarea>
        </div>
        <div class="row">
          <input id="k" class="grow" type="number" min="1" max="12" value="6" />
          <button id="ask">Ask</button>
        </div>
      </div>
    </section>

    <section class="panel grid grid-2">
      <div class="card">
        <div class="muted small">Answer</div>
        <pre id="answer" style="margin-top:8px;"></pre>
      </div>
      <div class="card">
        <div class="muted small">Citations</div>
        <div id="cites" class="grid" style="margin-top:8px;"></div>
      </div>
      <div class="card">
        <div class="muted small">Red-flag check</div>
        <div id="rf" style="margin-top:8px;"></div>
      </div>
      <div class="card">
        <div class="muted small">Retrieved chunks (debug)</div>
        <div id="retr" class="grid" style="margin-top:8px;"></div>
      </div>
    </section>
  </main>

  <script>
    const askBtn = document.getElementById('ask');
    const qEl = document.getElementById('q');
    const kEl = document.getElementById('k');
    const out = (id) => document.getElementById(id);

    async function callAsk(query, k) {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ query, k: Number(k) || 6 })
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function showRF(rf) {
      const box = out('rf');
      box.innerHTML = '';
      if (!rf || rf.severity === 'none') {
        box.innerHTML = '<span class="chip">No emergency signs detected.</span>';
        return;
      }
      const pill = document.createElement('div');
      pill.className = 'pill danger';
      pill.textContent = rf.banner || 'Emergency signs detected.';
      box.appendChild(pill);
      if (rf.matches?.length) {
        const chips = document.createElement('div');
        chips.className = 'chips'; 
        rf.matches.forEach(m => {
          const c = document.createElement('div'); c.className = 'chip'; c.textContent = m; chips.appendChild(c);
        });
        box.appendChild(chips);
      }
    }

    function showCites(citations) {
      const box = out('cites');
      box.innerHTML = '';
      (citations || []).forEach(c => {
        const div = document.createElement('div');
        div.className = 'chip';
        div.innerHTML = `<span class="small">[#${c.n}]</span> <a href="${c.url}" target="_blank">${c.title}</a>`;
        box.appendChild(div);
      });
    }

    function showRetrieved(rows) {
      const box = out('retr');
      box.innerHTML = '';
      (rows || []).slice(0,6).forEach(r => {
        const div = document.createElement('div'); div.className='card';
        div.innerHTML = `<div class="small muted">${r.meta?.title || ''}</div><div style="margin-top:6px;">${(r.text||'').slice(0,320)}</div>`;
        box.appendChild(div);
      });
    }

    askBtn.addEventListener('click', async () => {
      askBtn.disabled = true;
      out('answer').textContent = 'Thinking…';
      out('cites').innerHTML = '';
      out('rf').innerHTML = '';
      out('retr').innerHTML = '';
      try {
        const data = await callAsk(qEl.value.trim(), kEl.value);
        out('answer').textContent = data.answer || '';
        showCites(data.citations || []);
        showRF(data.red_flag || {});
        showRetrieved(data.retrieved || []);
      } catch (err) {
        out('answer').textContent = 'Error: ' + (err?.message || err);
      } finally {
        askBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
