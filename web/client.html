<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Doc_GPT client</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 12px; }
    textarea { width: 100%; height: 120px; }
    pre { background:#f6f7f9; padding:12px; border-radius:8px; white-space:pre-wrap; }
    .cite { font-size: 14px; color: #444; }
  </style>
</head>
<body>
  <h1>Doc_GPT (local)</h1>
  <p>Server should be on <code>http://127.0.0.1:8000</code>. Type a question and click ask.</p>

  <textarea id="q" placeholder="e.g., I have a sore throat and mild fever. What should I do?"></textarea>
  <div>
    <button id="ask">Ask</button>
    <span id="status"></span>
  </div>

  <h3>Answer</h3>
  <pre id="answer"></pre>

  <h3>Citations</h3>
  <div id="cites"></div>

  <script>
    const askBtn = document.getElementById('ask');
    const status = document.getElementById('status');
    askBtn.onclick = async () => {
      status.textContent = '…sending';
      const q = document.getElementById('q').value.trim();
      try {
        const r = await fetch('http://127.0.0.1:8000/ask', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ question: q, k: 5 })
        });
        const data = await r.json();
        document.getElementById('answer').textContent = data.answer || '';
        document.getElementById('cites').innerHTML =
          (data.citations||[]).map(c => `<div class="cite"><a href="${c.url}" target="_blank">${c.title||c.url}</a><div>${c.snippet||''}</div></div>`).join('');
        status.textContent = r.ok ? '✓' : '⚠';
      } catch (e) {
        status.textContent = '✗ network error';
        console.error(e);
      }
    };
  </script>
</body>
</html>
